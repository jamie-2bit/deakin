<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JD's Massive News Multiview.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .subtitle {
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr)); /* 5 wide */
      gap: 16px;
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 8px;
      overflow: hidden;
      background: #111827;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .info {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .stats, .url {
      font-size: 0.8rem;
      color: #9ca3af;
      word-break: break-all;
    }

    .status {
      font-size: 0.75rem;
      color: #f97373;
    }

    .controls {
      margin: 0 0 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #111827;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #e5e7eb;
      cursor: pointer;
    }

    button:hover {
      border-color: #6b7280;
      background: #020617;
    }
  </style>
</head>
<body>
  <h1>JD's Massive News Multiview.</h1>
  <div class="subtitle">All streams are muted by default (for autoplay).</div>

  <div class="controls">
    <button id="startAll">Start / Restart All Streams</button>
  </div>

  <div class="grid" id="streamsGrid"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>

    const streams = [
      // --- 5 originals ---
      { id: "dw",     name: "DW",                     url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { id: "abcau",  name: "ABC News Australia",     url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { id: "alj",    name: "Al Jazeera",             url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },
      { id: "cna",    name: "CNA",                    url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index_5.m3u8" },
      { id: "sky",    name: "Sky News International", url: "https://linear417-gb-hls1-prd-ak.cdn.skycdp.com/100e/Content/HLS_001_1080_30/Live/channel(skynews)/index_1080-30.m3u8" },

      // --- 3 previously confirmed working ---
      { id: "nhk",    name: "NHK World Japan",        url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
      { id: "abcus",  name: "ABC News Live (US)",     url: "https://abcnews-streams.akamaized.net/hls/live/2023565/abcnewshudson6/master_4000.m3u8" },
      { id: "bloom",  name: "Bloomberg Europe",       url: "https://www.bloomberg.com/media-manifest/streams/eu.m3u8" },

      // --- CGTN you confirmed working ---
      { id: "cgtndoc", name: "CGTN Documentary",      url: "https://english-livebkali.cgtn.com/live/doccgtn.m3u8" },

      // --- TVRI you confirmed working ---
      { id: "tvriworld", name: "TVRI World",          url: "https://ott-balancer.tvri.go.id/live/eds/TVRIWorld/hls/TVRIWorld.m3u8" },

      // --- 5 new test streams ---
      { id: "presstv", name: "Press TV",              url: "https://press-tv.live/stream/ptv_e_hls.m3u8" },

      { id: "dwes",    name: "DW Español",            url: "https://dwstream3-lh.akamaihd.net/i/dwstream3_live@327065/index_1_av-p.m3u8" },

      { id: "pptv",    name: "PPTV News Thailand",    url: "https://stream1.pptvthailand.com/live/pptvhd.m3u8" },

      { id: "c24h",    name: "Canal 24 Horas (Chile)", url: "https://cdn-canal24horas-tv.canal24horas.cl/hls/live/master.m3u8" },

      { id: "nhkbs1",  name: "NHK BS1 (Alt Feed)",    url: "https://media-nhk.bcast.jp/hls/live/2092239/bs1_720p/master.m3u8" }
    ];

    const grid = document.getElementById("streamsGrid");
    const hlsInstances = {};

    // Build UI
    streams.forEach((s) => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="video-wrapper">
          <video id="video-${s.id}" muted playsinline autoplay controls></video>
        </div>
        <div class="info">
          <div class="name">${s.name}</div>
          <div class="stats" id="stats-${s.id}">Resolution: –</div>
          <div class="url"><strong>Stream URL:</strong> ${s.url}</div>
          <div class="status" id="status-${s.id}"></div>
        </div>
      `;

      grid.appendChild(card);

      const video = card.querySelector("video");
      video.addEventListener("dblclick", () => {
        if (!document.fullscreenElement) video.requestFullscreen();
        else document.exitFullscreen();
      });
    });

    function updateResolution(video, el) {
      const w = video.videoWidth;
      const h = video.videoHeight;
      el.textContent = (w && h) ? `Resolution: ${w}×${h}` : "Resolution: –";
    }

    function initStream(stream) {
      const video    = document.getElementById(`video-${stream.id}`);
      const statsEl  = document.getElementById(`stats-${stream.id}`);
      const statusEl = document.getElementById(`status-${stream.id}`);

      statusEl.textContent = "";

      if (hlsInstances[stream.id]) hlsInstances[stream.id].destroy();

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = stream.url;
        video.addEventListener("loadedmetadata", () => {
          video.play().catch(() => statusEl.textContent = "Autoplay blocked – press play.");
          updateResolution(video, statsEl);
        });

      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ lowLatencyMode: true });
        hlsInstances[stream.id] = hls;

        hls.loadSource(stream.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => statusEl.textContent = "Autoplay blocked – press play.");
        });

        hls.on(Hls.Events.FRAG_LOADED, () => updateResolution(video, statsEl));
        hls.on(Hls.Events.LEVEL_SWITCHED, () => updateResolution(video, statsEl));

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            statusEl.textContent = "Stream error – recovering...";
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else {
              statusEl.textContent = "Fatal error – reload page.";
              hls.destroy();
            }
          }
        });

      } else {
        statusEl.textContent = "HLS not supported by this browser.";
      }
    }

    function startAll() {
      streams.forEach((s) => initStream(s));
    }

    document.getElementById("startAll").addEventListener("click", startAll);
    startAll(); // auto-start
  </script>
</body>
</html>
