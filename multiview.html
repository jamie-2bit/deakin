<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JD's Deakin News Multiview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .subtitle {
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 8px;
      overflow: hidden;
      background: #111827;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .info {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name {
      font-size: 1rem;
      font-weight: 600;
    }

    .stats, .url {
      font-size: 0.75rem;
      color: #9ca3af;
      word-break: break-all;
    }

    .status {
      font-size: 0.75rem;
      color: #f97373;
    }

    .controls {
      margin: 0 0 12px;
    }

    button {
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #111827;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #e5e7eb;
      cursor: pointer;
    }

    button:hover {
      border-color: #6b7280;
      background: #020617;
    }
  </style>
</head>
