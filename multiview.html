<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JD's Deakin News Multiview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 10px;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .controls {
      margin-bottom: 4px;
    }

    button {
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #111827;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #e5e7eb;
      cursor: pointer;
    }
    button:hover {
      border-color: #6b7280;
      background: #020617;
    }

    /* Fullscreen responsive grid */
    .grid {
      flex: 1 1 auto;
      display: grid;
      gap: 10px;
      width: 100%;
      height: 100%;

      /* auto-fit into as many rows/columns as needed */
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      grid-auto-rows: 1fr;
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0; /* important for flex/grid children */
    }

    .video-wrapper {
      flex: 1 1 auto;
      width: 100%;
      background: black;
      border-radius: 8px;
      overflow: hidden;

      /* Maintain 16:9 ratio but allow expansion */
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .info {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.75rem;
    }

    .name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .url {
      color: #9ca3af;
      word-break: break-all;
      font-size: 0.7rem;
    }

    .stats {
      color: #9ca3af;
    }

    .status {
      font-size: 0.75rem;
      color: #f97373;
    }

  </style>
</head>
<body>
  <h1>JD's Deakin News Multiview</h1>
  <div class="subtitle">All streams muted by default for autoplay.</div>

  <div class="controls">
    <button id="startAll">Start / Restart All Streams</button>
  </div>

  <div class="grid" id="streamsGrid"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const streams = [
      { id: "dw",  name: "DW",                 url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { id: "abc", name: "ABC News Australia", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { id: "aljazeera", name: "Al Jazeera",   url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },
      { id: "cna", name: "CNA",                url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index_5.m3u8" },
      { id: "sky", name: "Sky News International", url: "https://linear417-gb-hls1-prd-ak.cdn.skycdp.com/100e/Content/HLS_001_1080_30/Live/channel(skynews)/index_1080-30.m3u8" }
    ];

    const grid = document.getElementById("streamsGrid");
    const hlsInstances = {};

    // Build UI
    streams.forEach((s) => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="video-wrapper">
          <video id="video-${s.id}" muted playsinline autoplay controls></video>
        </div>
        <div class="info">
          <div class="name">${s.name}</div>
          <div class="stats" id="stats-${s.id}">Resolution: –</div>
          <div class="url">${s.url}</div>
          <div class="status" id="status-${s.id}"></div>
        </div>
      `;

      grid.appendChild(card);

      const video = card.querySelector("video");

      // Double-click fullscreen
      video.addEventListener("dblclick", () => {
        if (!document.fullscreenElement) video.requestFullscreen?.();
        else document.exitFullscreen?.();
      });
    });

    function updateResolution(video, el) {
      const w = video.videoWidth;
      const h = video.videoHeight;
      el.textContent = (w && h) ? `Resolution: ${w}×${h}` : "Resolution: –";
    }

    function initStream(stream) {
      const video = document.getElementById(`video-${stream.id}`);
      const statsEl = document.getElementById(`stats-${stream.id}`);
      const statusEl = document.getElementById(`status-${stream.id}`);

      statusEl.textContent = "";

      if (hlsInstances[stream.id]) {
        hlsInstances[stream.id].destroy();
      }

      // Native HLS support
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = stream.url;
        video.addEventListener("loadedmetadata", () => {
          video.play().catch(() => {
            statusEl.textContent = "Autoplay blocked — press play.";
          });
          updateResolution(video, statsEl);
        });

      // hls.js fallback
      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ lowLatencyMode: true });
        hlsInstances[stream.id] = hls;

        hls.loadSource(stream.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {
            statusEl.textContent = "Autoplay blocked — press play.";
          });
        });

        hls.on(Hls.Events.FRAG_LOADED, () => updateResolution(video, statsEl));
        hls.on(Hls.Events.LEVEL_SWITCHED, () => updateResolution(video, statsEl));

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            statusEl.textContent = "Stream error — recovering...";
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
              case Hls.ErrorTypes.MEDIA_ERROR:   hls.recoverMediaError(); break;
              default:
                hls.destroy();
                statusEl.textContent = "Fatal error — reload page.";
            }
          }
        });

      } else {
        statusEl.textContent = "HLS not supported in this browser.";
      }
    }

    function startAll() {
      streams.forEach((s) => initStream(s));
    }

    document.getElementById("startAll").addEventListener("click", startAll);

    // Start once on load
    startAll();
  </script>
</body>
</html>
