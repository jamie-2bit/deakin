<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JD's 5-Stream News Multiview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 8px;
      overflow: hidden;
      background: #111827;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .info {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .stats, .url {
      font-size: 0.8rem;
      color: #9ca3af;
      word-break: break-all;
    }

    .status {
      font-size: 0.75rem;
      color: #f97373;
    }

    button {
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #111827;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #e5e7eb;
      cursor: pointer;
    }

    .controls {
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <h1>JD's 5-Stream News Multiview</h1>

  <div class="controls">
    <button id="startAll">Start / Restart All Streams</button>
  </div>

  <div class="grid" id="streamsGrid"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>

    const streams = [
      { id: "abcau",  name: "ABC News (Australia)",  
        url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },

      { id: "dw",     name: "DW (Germany)", 
        url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },

      { id: "bbc",    name: "BBC World News (UK)",  
        url: "https://vs-hls-pushb-apac-gcomm.live.cf.md.bbci.co.uk/x=4/i=urn:bbc:pips:service:bbc_world_news_africa/iptv_hd_abr_v1.m3u8" },

      { id: "sky",    name: "Sky News International (UK)",  
        url: "https://linear417-gb-hls1-prd-ak.cdn.skycdp.com/100e/Content/HLS_001_1080_30/Live/channel(skynews)/index_1080-30.m3u8" },

      { id: "nhk",    name: "NHK World (Japan)",  
        url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" }
    ];

    const grid = document.getElementById("streamsGrid");
    const hlsInstances = {};

    /* ----- UI BUILD ----- */
    streams.forEach((s) => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="video-wrapper">
          <video id="video-${s.id}" muted playsinline autoplay controls></video>
        </div>
        <div class="info">
          <div class="name">${s.name}</div>
          <div class="stats" id="stats-${s.id}">Resolution: –</div>
          <div class="url"><strong>Stream URL:</strong> ${s.url}</div>
          <div class="status" id="status-${s.id}"></div>
        </div>
      `;

      grid.appendChild(card);

      const video = card.querySelector("video");

      // Double-click fullscreen
      video.addEventListener("dblclick", () => {
        if (!document.fullscreenElement) video.requestFullscreen();
        else document.exitFullscreen();
      });
    });

    /* ----- STREAM INIT ----- */
    function updateResolution(video, el) {
      const w = video.videoWidth, h = video.videoHeight;
      el.textContent = (w && h) ? `Resolution: ${w}×${h}` : "Resolution: –";
    }

    function initStream(stream) {
      const video    = document.getElementById(`video-${stream.id}`);
      const statsEl  = document.getElementById(`stats-${stream.id}`);
      const statusEl = document.getElementById(`status-${stream.id}`);

      statusEl.textContent = "";

      if (hlsInstances[stream.id]) hlsInstances[stream.id].destroy();

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = stream.url;
        video.addEventListener("loadedmetadata", () => {
          video.play().catch(() => statusEl.textContent = "Autoplay blocked — press play.");
          updateResolution(video, statsEl);
        });

      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ lowLatencyMode: true });
        hlsInstances[stream.id] = hls;
        hls.loadSource(stream.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => statusEl.textContent = "Autoplay blocked — press play.");
        });

        hls.on(Hls.Events.FRAG_LOADED, () => updateResolution(video, statsEl));
        hls.on(Hls.Events.LEVEL_SWITCHED, () => updateResolution(video, statsEl));

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            statusEl.textContent = "Stream error — recovering…";
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else {
              statusEl.textContent = "Fatal error — reload page.";
              hls.destroy();
            }
          }
        });

      } else {
        statusEl.textContent = "HLS not supported.";
      }
    }

    function startAll() {
      streams.forEach(initStream);
    }

    document.getElementById("startAll").addEventListener("click", startAll);

    // Load automatically on page load
    startAll();

  </script>
</body>
</html>
