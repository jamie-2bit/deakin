<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>News Multiview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .subtitle {
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 8px;
      overflow: hidden;
      background: #111827;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .info {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .stats {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .status {
      font-size: 0.75rem;
      color: #f97373;
    }

    .controls {
      margin: 0 0 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #111827;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #e5e7eb;
      cursor: pointer;
    }

    button:hover {
      border-color: #6b7280;
      background: #020617;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <h1>Live News Multiview</h1>
  <div class="subtitle">
    All streams are muted by default (for autoplay). Click the button if your browser blocks autoplay.
  </div>

  <div class="controls">
    <button id="startAll">Start / Restart All Streams</button>
  </div>

  <div class="grid" id="streamsGrid">
    <!-- Cards are generated via JavaScript -->
  </div>

  <!-- hls.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const streams = [
      {
        id: "dw",
        name: "DW",
        url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8",
      },
      {
        id: "abc",
        name: "ABC News Australia",
        url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8",
      },
      {
        id: "aljazeera",
        name: "Al Jazeera",
        url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8",
      },
      {
        id: "cna",
        name: "CNA",
        url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index_5.m3u8",
      },
      {
        id: "sky",
        name: "Sky News International",
        url: "https://linear417-gb-hls1-prd-ak.cdn.skycdp.com/100e/Content/HLS_001_1080_30/Live/channel(skynews)/index_1080-30.m3u8",
      },
    ];

    const grid = document.getElementById("streamsGrid");
    const hlsInstances = {};
    const streamTimers = {};
    const streamBitrates = {}; // kbps per stream id

    function formatTime(seconds) {
      const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
      const s = String(seconds % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function startStreamTimer(streamId) {
      const existing = streamTimers[streamId];
      if (existing && existing.intervalId) return;

      const timeEl = document.getElementById(`time-${streamId}`);
      if (!timeEl) return;

      let seconds = 0;
      timeEl.textContent = "Time Playing: 00:00:00";

      const intervalId = setInterval(() => {
        seconds++;
        timeEl.textContent = "Time Playing: " + formatTime(seconds);
      }, 1000);

      streamTimers[streamId] = { intervalId, seconds };
    }

    function stopStreamTimer(streamId) {
      const existing = streamTimers[streamId];
      if (existing && existing.intervalId) {
        clearInterval(existing.intervalId);
      }
      delete streamTimers[streamId];
    }

    // Build the DOM cards
    streams.forEach((s) => {
      const card = document.createElement("div");
      card.className = "card";
      card.id = `card-${s.id}`;

      card.innerHTML = `
        <div class="video-wrapper">
          <video
            id="video-${s.id}"
            muted
            playsinline
            autoplay
            controls
          ></video>
        </div>
        <div class="info">
          <div class="name">${s.name}</div>
          <div class="stats" id="stats-${s.id}">Resolution: – | Bitrate: –</div>
          <div class="stats" id="time-${s.id}">Time Playing: 00:00:00</div>
          <div class="status" id="status-${s.id}"></div>
        </div>
      `;

      grid.appendChild(card);

      const video = card.querySelector("video");
      video.addEventListener("play", () => {
        startStreamTimer(s.id);
      });

      // Double-click fullscreen
      video.addEventListener("dblclick", () => {
        if (!document.fullscreenElement) {
          if (video.requestFullscreen) video.requestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });
    });

    function updateStatsDisplay(streamId, video, statsEl) {
      const width = video.videoWidth || 0;
      const height = video.videoHeight || 0;

      let resText = "Resolution: –";
      if (width && height) {
        resText = `Resolution: ${width}×${height}`;
      }

      const kbps = streamBitrates[streamId];
      const bitrateText = (typeof kbps === "number" && isFinite(kbps) && kbps > 0)
        ? `Bitrate: ${kbps} kbps`
        : "Bitrate: –";

      statsEl.textContent = `${resText} | ${bitrateText}`;
    }

    function initStream(stream) {
      const video = document.getElementById(`video-${stream.id}`);
      const statsEl = document.getElementById(`stats-${stream.id}`);
      const statusEl = document.getElementById(`status-${stream.id}`);

      statusEl.textContent = "";
      streamBitrates[stream.id] = undefined;

      // Destroy old instance if present
      if (hlsInstances[stream.id]) {
        hlsInstances[stream.id].destroy();
        delete hlsInstances[stream.id];
      }

      // Native HLS support (Safari, etc.) – no bitrate here, just resolution
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = stream.url;
        video.addEventListener("loadedmetadata", () => {
          video.play().catch(() => {
            statusEl.textContent = "Autoplay blocked – press play.";
          });
          updateStatsDisplay(stream.id, video, statsEl);
        });
      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
        });
        hlsInstances[stream.id] = hls;

        hls.loadSource(stream.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = true;
          video.play().catch(() => {
            statusEl.textContent = "Autoplay blocked – press play.";
          });
        });

        // Bitrate from fragment size / duration
        hls.on(Hls.Events.FRAG_LOADED, (event, data) => {
          const stats = data.stats || {};
          const frag = data.frag || {};

          const bytes = stats.loaded || stats.total || 0;  // bytes
          const duration = frag.duration || 0;             // seconds

          if (bytes > 0 && duration > 0) {
            const bits = bytes * 8;
            const kbps = Math.round(bits / duration / 1000);
            if (kbps > 0 && isFinite(kbps)) {
              streamBitrates[stream.id] = kbps;
            }
          }

          updateStatsDisplay(stream.id, video, statsEl);
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, () => {
          updateStatsDisplay(stream.id, video, statsEl);
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            statusEl.textContent = "Stream error – trying to recover...";
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                statusEl.textContent = "Fatal error – reload page.";
                stopStreamTimer(stream.id);
                break;
            }
          }
        });

        video.addEventListener("loadedmetadata", () => {
          updateStatsDisplay(stream.id, video, statsEl);
        });
      } else {
        statusEl.textContent = "HLS not supported in this browser.";
      }
    }

    function startAllStreams() {
      streams.forEach((s) => {
        stopStreamTimer(s.id);
        initStream(s);
      });
    }

    document.getElementById("startAll").addEventListener("click", () => {
      startAllStreams();
    });

    // Kick everything off on load
    startAllStreams();
  </script>
</body>
</html>
