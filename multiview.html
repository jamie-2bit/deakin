<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JD's Deakin News Multiview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .subtitle {
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: #111827;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    .info {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .stats {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .status {
      font-size: 0.75rem;
      color: #f97373;
    }

    .controls {
      margin: 0 0 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #111827;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #e5e7eb;
      cursor: pointer;
    }

    button:hover {
      border-color: #6b7280;
      background: #020617;
    }

  </style>
</head>
<body>
  <h1>JD's Deakin News Multiview</h1>
  <div class="subtitle">
    All streams are muted by default (for autoplay). Click the button if your browser blocks autoplay.
  </div>

  <div class="controls">
    <button id="startAll">Start / Restart All Streams</button>
  </div>

  <div class="grid" id="streamsGrid"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const streams = [
      { id: "dw", name: "DW", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { id: "abc", name: "ABC News Australia", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { id: "aljazeera", name: "Al Jazeera", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },
      { id: "cna", name: "CNA", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index_5.m3u8" },
      { id: "sky", name: "Sky News International", url: "https://linear417-gb-hls1-prd-ak.cdn.skycdp.com/100e/Content/HLS_001_1080_30/Live/channel(skynews)/index_1080-30.m3u8" }
    ];

    const grid = document.getElementById("streamsGrid");
    const hlsInstances = {};
    const streamTimers = {};

    // Format HH:MM:SS
    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function startTimer(streamId) {
      if (streamTimers[streamId]?.intervalId) return;

      const el = document.getElementById(`time-${streamId}`);
      if (!el) return;

      let sec = 0;
      el.textContent = "Time Playing: 00:00:00";

      const intervalId = setInterval(() => {
        sec++;
        el.textContent = "Time Playing: " + formatTime(sec);
      }, 1000);

      streamTimers[streamId] = { intervalId, sec };
    }

    function stopTimer(streamId) {
      if (streamTimers[streamId]?.intervalId) {
        clearInterval(streamTimers[streamId].intervalId);
      }
      delete streamTimers[streamId];
    }

    // Build UI
    streams.forEach((s) => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="video-wrapper">
          <video id="video-${s.id}" muted playsinline autoplay controls></video>
        </div>
        <div class="info">
          <div class="name">${s.name}</div>
          <div class="stats" id="stats-${s.id}">Resolution: –</div>
          <div class="stats" id="time-${s.id}">Time Playing: 00:00:00</div>
          <div class="status" id="status-${s.id}"></div>
        </div>
      `;

      grid.appendChild(card);

      const video = card.querySelector("video");
      video.addEventListener("play", () => startTimer(s.id));

      // Fullscreen on double-click
      video.addEventListener("dblclick", () => {
        if (!document.fullscreenElement) video.requestFullscreen?.();
        else document.exitFullscreen?.();
      });
    });

    function updateResolution(video, el) {
      const w = video.videoWidth;
      const h = video.videoHeight;
      el.textContent = w && h ? `Resolution: ${w}×${h}` : "Resolution: –";
    }

    function initStream(stream) {
      const video = document.getElementById(`video-${stream.id}`);
      const statsEl = document.getElementById(`stats-${stream.id}`);
      const statusEl = document.getElementById(`status-${stream.id}`);

      statusEl.textContent = "";

      if (hlsInstances[stream.id]) {
        hlsInstances[stream.id].destroy();
      }

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = stream.url;
        video.addEventListener("loadedmetadata", () => updateResolution(video, statsEl));
      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ lowLatencyMode: true });
        hlsInstances[stream.id] = hls;
        hls.loadSource(stream.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {
            statusEl.textContent = "Autoplay blocked – press play.";
          });
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, () => updateResolution(video, statsEl));
        hls.on(Hls.Events.FRAG_LOADED, () => updateResolution(video, statsEl));

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            statusEl.textContent = "Stream error – recovering...";
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
              case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
              default:
                statusEl.textContent = "Fatal error – reload page.";
                hls.destroy();
                stopTimer(stream.id);
            }
          }
        });
      } else {
        statusEl.textContent = "HLS not supported in this browser.";
      }
    }

    function startAll() {
      streams.forEach((s) => {
        stopTimer(s.id);
        initStream(s);
      });
    }

    document.getElementById("startAll").addEventListener("click", startAll);

    startAll();
  </script>
</body>
</html>
